site_name: Ghost → Discord Worker
site_description: Sync Ghost CMS memberships to Discord roles with a Cloudflare Worker.
site_url: https://ltoinel.github.io/ghost-discord-worker/
repo_url: https://github.com/ltoinel/ghost-discord-worker
repo_name: ltoinel/ghost-discord-worker
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 <a href="https://ludovic.toinel.com">Ludovic Toinel</a> · Released under the MIT License

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: fontawesome/brands/discord
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ltoinel/ghost-discord-worker
    - icon: fontawesome/brands/discourse
      link: https://forum.ghost.org/t/discord-ghost-role-sync/61933/8
      name: Ghost forum discussion

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Discord setup: discord-setup.md
  - Development: development.md
  - Specification:
      - spec/index.md
      - Overview: spec/01-overview.md
      - Architecture: spec/02-architecture.md
      - Data Model: spec/03-data-model.md
      - API Reference: spec/04-api-reference.md
      - Authentication: spec/05-authentication.md
      - Event Handling: spec/06-event-handling.md
      - Slash Commands: spec/07-slash-commands.md
      - Configuration: spec/08-configuration.md
      - Security: spec/09-security.md
      - Error Handling: spec/10-error-handling.md
