version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # MkDocs 2.0 drops the plugin/theme system Material for MkDocs relies on.
      - dependency-name: mkdocs
        update-types: ["version-update:semver-major"]
